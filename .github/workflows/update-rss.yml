name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch RSS Feed, Sort by Date and Build Grid (Node.js)
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const https = require('https');

          const rssUrl = "https://podeduc.apps.education.fr/rss-video/creia/";

          https.get(rssUrl, (res) => {
            let data = '';
            res.on('data', (chunk) => { data += chunk; });
            res.on('end', () => {
              const items = data.split('<item>');
              items.shift(); 

              const videoList = [];

              items.forEach(item => {
                const titleMatch = item.match(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/);
                const linkMatch = item.match(/<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/);
                const dateMatch = item.match(/<pubDate>(.*?)<\/pubDate>/);

                if (titleMatch && linkMatch) {
                  const title = titleMatch[1].trim();
                  const link = linkMatch[1].trim();
                  const pubDate = dateMatch ? new Date(dateMatch[1]) : new Date(0);

                  if (title !== "PodEduC" && title !== "PodEduC - CREIA") {
                    videoList.push({ title, link, pubDate });
                  }
                }
              });

              // Tri par ordre de récence
              videoList.sort((a, b) => b.pubDate - a.pubDate);

              let videoCardsHtml = '';

              videoList.forEach(video => {
                // Formater la date en JJ/MM/AAAA
                let formattedDate = "";
                if (video.pubDate.getTime() !== 0) {
                  const day = String(video.pubDate.getDate()).padStart(2, '0');
                  const month = String(video.pubDate.getMonth() + 1).padStart(2, '0');
                  const year = video.pubDate.getFullYear();
                  formattedDate = `${day}/${month}/${year}`;
                }

                videoCardsHtml += `
            <a class="video-card" href="${video.link}" target="_blank" rel="opener">
              <div class="thumbnail-wrapper">
                <svg class="pod-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.3"/>
                  <polygon points="40,30 70,50 40,70" fill="#ffffff" />
                </svg>
              </div>
              <div class="video-info">
                <div>
                  <p class="video-title">${video.title}</p>
                  ${formattedDate ? `<p class="video-date">Publié le ${formattedDate}</p>` : ''}
                </div>
              </div>
            </a>`;
              });

              const htmlHeader = '<!DOCTYPE html>\n' +
          '<html lang="fr">\n' +
          '<head>\n' +
          '  <meta charset="UTF-8">\n' +
          '  <title>Chaîne CREIA</title>\n' +
          '  <base target="_blank">\n' +
          '  <style>\n' +
          '    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #ffffff; color: #333; padding: 10px; margin: 0; }\n' +
          '    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 100%; margin: 0 auto; }\n' +
          '    .video-card { background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.2s; display: flex; flex-direction: column; border: 1px solid #eef2f5; }\n' +
          '    .video-card:hover { transform: translateY(-4px); box-shadow: 0 6px 15px rgba(0,123,255,0.15); }\n' +
          '    .thumbnail-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: linear-gradient(135deg, #001529 0%, #0056b3 100%); overflow: hidden; display: flex; align-items: center; justify-content: center; }\n' +
          '    .pod-logo-svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; transition: transform 0.2s; }\n' +
          '    .video-card:hover .pod-logo-svg { transform: translate(-50%, -50%) scale(1.1); }\n' +
          '    .video-info { padding: 15px; flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #f8f9fa; min-height: 80px; text-align: center; }\n' +
          '    .video-title { font-weight: bold; font-size: 14px; margin: 0 0 5px 0; color: #2c3e50; line-height: 1.4; }\n' +
          '    .video-date { font-size: 12px; color: #7f8c8d; margin: 0; }\n' +
          '  </style>\n' +
          '</head>\n' +
          '<body>\n' +
          '  <div class="video-grid">\n';

              const htmlFooter = '\n  </div>\n</body>\n</html>';
              const finalHtml = htmlHeader + videoCardsHtml + htmlFooter;

              fs.writeFileSync('index.html', finalHtml);
              console.log("index.html mis à jour : trié par date avec dates affichées !");
            });
          }).on('error', (e) => {
            console.error(e);
            process.exit(1);
          });
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Affichage des dates de parution formatées" && git push)
