name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch RSS Feed and Build Clean Grid (Node.js)
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const https = require('https');

          const rssUrl = "https://podeduc.apps.education.fr/rss-video/creia/";

          https.get(rssUrl, (res) => {
            let data = '';
            res.on('data', (chunk) => { data += chunk; });
            res.on('end', () => {
              const items = data.split('<item>');
              items.shift(); 

              let videoCardsHtml = '';

              items.forEach(item => {
                const titleMatch = item.match(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/);
                const linkMatch = item.match(/<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/);

                if (titleMatch && linkMatch) {
                  const title = titleMatch[1].trim();
                  const link = linkMatch[1].trim();

                  if (title !== "PodEduC" && title !== "PodEduC - CREIA") {
                    // Utilisation d'une image générique de l'application qui passe partout
                    const defaultLogo = "https://portail.apps.education.fr/images/apps/podeduc.png";

                    videoCardsHtml += `
            <a class="video-card" href="${link}" target="_blank" rel="opener">
              <div class="thumbnail-wrapper">
                <img src="${defaultLogo}" alt="PodEduC Logo">
                <div class="play-button">▶</div>
              </div>
              <div class="video-info">
                <p class="video-title">${title}</p>
              </div>
            </a>`;
                  }
                }
              });

              const htmlContent = `<!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Chaîne CREIA</title>
            <base target="_blank">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #ffffff; color: #333; padding: 10px; margin: 0; }
              .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 100%; margin: 0 auto; }
              .video-card { background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.2s; display: flex; flex-direction: column; border: 1px solid #eef2f5; }
              .video-card:hover { transform: translateY(-4px); box-shadow: 0 6px 15px rgba(0,123,255,0.15); }
              .thumbnail-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: linear-gradient(135deg, #001529 0%, #0056b3 100%); overflow: hidden; }
              .thumbnail-wrapper img { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: auto; height: 60%; object-fit: contain; opacity: 0.8; transition: opacity 0.2s; }
              .video-card:hover .thumbnail-wrapper img { opacity: 0.4; }
              .play-button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: rgba(0,0,0,0.5); border-radius: 50%; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; text-indent: 4px; border: 2px solid white; opacity: 0; transition: opacity 0.2s; z-index: 2; }
              .video-card:hover .play-button { opacity: 1; }
              .video-info { padding: 15px; flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #f8f9fa; min-height: 60px; }
              .video-title { font-weight: bold; font-size: 14px; margin: 0; color: #2c3e50; line-height: 1.4; text-align: center; }
            </style>
          </head>
          <body>
            <div class="video-grid">
              ${videoCardsHtml}
            </div>
          </body>
          </html>`;

              fs.writeFileSync('index.html', htmlContent);
              console.log("index.html mis à jour avec styles et logos !");
            });
          }).on('error', (e) => {
            console.error(e);
            process.exit(1);
          });
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Correction totale du rendu des vignettes avec logo" && git push)
