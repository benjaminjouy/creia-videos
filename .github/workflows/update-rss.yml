name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *' # S'exécute automatiquement tous les jours à 6h du matin
  workflow_dispatch: # Permet de lancer la mise à jour manuellement en un clic

jobs:
  update-feed:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # Force Node 24 au cœur de l'action checkout pour tuer l'avertissement

      - name: Fetch RSS Feed and Build HTML
        run: |
          id_flux=$(curl -s "https://podeduc.apps.education.fr/rss-video/creia/")
          
          # Initialisation du fichier index.html avec le design propre
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Flux Vidéos CREIA</title>
            <style>
              body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #ffffff; color: #333; padding: 10px; margin: 0; }
              #video-list { max-width: 100%; margin: 0 auto; }
              .video-item { margin-bottom: 30px; border-bottom: 1px solid #e2e5ec; padding-bottom: 15px; text-align: center; }
              .video-title { font-weight: bold; font-size: 20px; color: #333; margin-bottom: 10px; }
              .video-link { color: #2980b9; text-decoration: underline; font-size: 1.1em; }
            </style>
          </head>
          <body>
            <div id="video-list">
          EOF

          # Extraction des titres et liens depuis le flux XML de PodÉduc
          titles=$(echo "$id_flux" | grep -oP '(?<=<title>).*?(?=</title>)' | tail -n +2)
          links=$(echo "$id_flux" | grep -oP '(?<=<link>).*?(?=</link>)' | tail -n +2)

          paste <(echo "$titles") <(echo "$links") | while IFS=$'\t' read -r title link; do
            if [ ! -z "$title" ] && [ ! -z "$link" ]; then
              cat << EOF >> index.html
              <div class="video-item">
                <p class="video-title">${title}</p>
                <a class="video-link" href="${link}" target="_blank" rel="noopener">Regarder la vidéo</a>
              </div>
          EOF
            fi
          done

          cat << 'EOF' >> index.html
            </div>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des vidéos CREIA" && git push)
