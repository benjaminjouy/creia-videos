name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Build HTML PodEduC Channel Page
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Chaîne CREIA PodEduC</title>
            <style>
              html, body { 
                margin: 0; 
                padding: 0; 
                width: 100%; 
                height: 100%; 
                /* Réactivation essentielle de la barre de défilement globale */
                overflow-y: auto !important; 
                background-color: #ffffff; 
              }
              
              /* Le wrapper gère maintenant le décalage pour masquer le texte et casser le voile noir */
              .wrapper {
                width: 100%;
                height: 2500px; /* Ajuste cette hauteur pour voir plus ou moins de vidéos */
                margin-top: -1250px; /* Remonté légèrement (un peu plus haut que -1450px) */
                position: relative;
                background-color: #ffffff;
              }
              
              /* L'iframe reste stable et ne propage plus son voile noir sur toute la page */
              iframe { 
                width: 100%; 
                height: 100%;
                border: none; 
              }
            </style>
          </head>
          <body>
            <div class="wrapper">
              <iframe src="https://podeduc.apps.education.fr/creia/" allowfullscreen transparency allow="autoplay; fullscreen"></iframe>
            </div>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Rétablissement du scroll et suppression définitive du voile" && git push)
