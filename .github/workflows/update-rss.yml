name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch RSS Feed and Build Clean Grid (Node.js)
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const https = require('https');

          const rssUrl = "https://podeduc.apps.education.fr/rss-video/creia/";

          https.get(rssUrl, (res) => {
            let data = '';
            res.on('data', (chunk) => { data += chunk; });
            res.on('end', () => {
              const items = data.split('<item>');
              items.shift(); 

              let videoCardsHtml = '';

              items.forEach(item => {
                const titleMatch = item.match(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/);
                const linkMatch = item.match(/<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/);

                if (titleMatch && linkMatch) {
                  const title = titleMatch[1].trim();
                  const link = linkMatch[1].trim();

                  if (title !== "PodEduC" && title !== "PodEduC - CREIA") {
                    const urlParts = link.replace(/\/$/, '').split('/');
                    const videoId = urlParts[urlParts.length - 1];
                    const thumbUrl = `https://podeduc.apps.education.fr/media/thumbnails/${videoId}.png`;

                    /* Ajout du rel="opener" pour forcer la sortie de l'iframe Magistère */
                    videoCardsHtml += `
            <a class="video-card" href="${link}" target="_blank" rel="opener">
              <div class="thumbnail-wrapper">
                <img src="${thumbUrl}" onerror="this.src='https://podeduc.apps.education.fr/static/core/img/logo-pod.png'" alt="Vignette">
              </div>
              <div class="video-info">
                <p class="video-title">${title}</p>
              </div>
            </a>`;
                  }
                }
              });

              const htmlContent = `<!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Chaîne CREIA</title>
            <!-- Force TOUS les liens à casser l'iframe pour s'ouvrir dehors -->
            <base target="_blank">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #ffffff; color: #333; padding: 10px; margin: 0; }
              .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 100%; margin: 0 auto; }
              .video-card { background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.2s; display: flex; flex-direction: column; }
              .video-card:hover { transform: translateY(-4px); }
              .thumbnail-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #eceff1; }
              .thumbnail-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
              .video-info { padding: 12px; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
              .video-title { font-weight: bold; font-size: 14px; margin: 0; color: #2c3e50; line-height: 1.4; text-align: center; }
            </style>
          </head>
          <body>
            <div class="video-grid">
              ${videoCardsHtml}
            </div>
          </body>
          </html>`;

              fs.writeFileSync('index.html', htmlContent);
              console.log("index.html mis à jour pour casser l'iframe !");
            });
          }).on('error', (e) => {
            console.error(e);
            process.exit(1);
          });
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Correction ouverture des onglets cibles" && git push)
