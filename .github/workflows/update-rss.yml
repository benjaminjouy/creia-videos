name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch RSS Feed and Build HTML
        run: |
          curl -sL "https://podeduc.apps.education.fr/rss-video/creia/" > flux.xml
          
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Flux Vidéos CREIA</title>
          </head>
          <body>
            <div id="links-container">
          EOF

          csplit -s -k -f item_ flux.xml '/<item>/' '{*}' 2>/dev/null || true

          for f in item_*; do
            if [ -f "$f" ]; then
              title=$(grep -oP '(?<=<title>).*?(?=</title>)' "$f" | head -n 1)
              link=$(grep -oP '(?<=<link>).*?(?=</link>)' "$f" | head -n 1)

              if [ ! -z "$title" ] && [ ! -z "$link" ]; then
                clean_title=$(echo "$title" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g')
                clean_link=$(echo "$link" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g')
                
                if [ "$clean_title" != "PodEduC" ] && [ "$clean_title" != "PodEduC - CREIA" ]; then
                  cat << EOF >> index.html
                  <div class="video-raw-item">
                    <h3>${clean_title}</h3>
                    <a href="${clean_link}">${clean_link}</a>
                  </div>
          EOF
                fi
              fi
            fi
          done

          rm -f item_* flux.xml

          cat << 'EOF' >> index.html
            </div>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Generation des liens sources" && git push)
