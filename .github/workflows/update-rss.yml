name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Build HTML PodEduC Channel Page
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Chaîne CREIA PodEduC</title>
            <style>
              html, body { 
                margin: 0; 
                padding: 0; 
                width: 100%; 
                height: 100%; 
                overflow-y: auto !important; 
                background-color: #ffffff; 
              }
              
              .scroll-box {
                width: 100%;
                height: 3000px; /* Recrée la barre de défilement latérale */
                position: relative;
              }
              
              .clipper {
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0;
                left: 0;
                overflow: hidden;
              }
              
              /* Remonté à -650px (plus haut que -850px) pour caler parfaitement le haut des vidéos */
              iframe { 
                position: absolute;
                top: -650px; 
                left: 0;
                width: 100%; 
                height: 100vh; /* Force l'iframe à faire la taille de l'écran : le voile noir est bloqué en haut */
                border: none; 
              }
            </style>
          </head>
          <body>
            <div class="scroll-box">
              <div class="clipper">
                <iframe src="https://podeduc.apps.education.fr/creia/" allowfullscreen transparency allow="autoplay; fullscreen"></iframe>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Ajustement hauteur 650px et blocage hauteur viewport" && git push)
