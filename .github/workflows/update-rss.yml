name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch and Filter RSS Feed with Python
        run: |
          cat << 'EOF' > parse_feed.py
          import urllib.request
          import xml.etree.ElementTree as ET

          url = "https://podeduc.apps.education.fr/rss-video/creia/"
          
          rss_template = """<?xml version="1.0" encoding="UTF-8" ?>
          <rss version="2.0">
          <channel>
            <title>Chaîne Vidéo CREIA</title>
            <link>https://benjaminjouy.github.io/creia-videos/</link>
            <description>Les dernières vidéos de la communauté CREIA</description>
          """

          try:
              response = urllib.request.urlopen(url)
              root = ET.fromstring(response.read())
              
              items_count = 0
              items_xml = ""
              
              for item in root.findall('.//item'):
                  if items_count >= 8: # On bloque strictement à 8 vidéos
                      break
                      
                  title = item.find('title')
                  link = item.find('link')
                  
                  if title is not None and link is not None:
                      t_text = title.text.replace("<![CDATA[", "").replace("]]>", "").strip()
                      l_text = link.text.replace("<![CDATA[", "").replace("]]>", "").strip()
                      
                      # On ignore les titres globaux de la chaîne
                      if t_text in ["PodEduC", "PodEduC - CREIA", "PodEduC  CREIA"]:
                          continue
                      
                      items_xml += f"""    <item>
                <title>{t_text}</title>
                <link>{l_text}</link>
                <description>{t_text}</description>
              </item>\n"""
                      items_count += 1
                      
              full_rss = rss_template + items_xml + "  </channel>\n</rss>"
              
              with open("flux.xml", "w", encoding="utf-8") as f:
                  f.write(full_rss)
                  
          except Exception as e:
              print(f"Erreur: {e}")
          EOF
          python3 parse_feed.py
          rm parse_feed.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add flux.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour du flux RSS épuré" && git push)
