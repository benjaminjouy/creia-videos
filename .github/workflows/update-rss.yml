name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch RSS Feed and Build Clean Grid
        run: |
          curl -sL "https://podeduc.apps.education.fr/rss-video/creia/" > flux.xml
          
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Chaîne CREIA</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #ffffff; color: #333; padding: 10px; margin: 0; }
              .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 100%; margin: 0 auto; }
              .video-card { background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.2s; display: flex; flex-direction: column; }
              .video-card:hover { transform: translateY(-4px); }
              .thumbnail-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #eceff1; }
              .thumbnail-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
              .video-info { padding: 12px; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
              .video-title { font-weight: bold; font-size: 14px; margin: 0; color: #2c3e50; line-height: 1.4; text-align: center; }
            </style>
          </head>
          <body>
            <div class="video-grid">
          EOF

          # Découpage du flux RSS pour générer les vignettes
          csplit -s -k -f item_ flux.xml '/<item>/' '{*}' 2>/dev/null || true

          for f in item_*; do
            if [ -f "$f" ]; then
              title=$(grep -oP '(?<=<title>).*?(?=</title>)' "$f" | head -n 1)
              link=$(grep -oP '(?<=<link>).*?(?=</link>)' "$f" | head -n 1)

              if [ ! -z "$title" ] && [ ! -z "$link" ]; then
                clean_title=$(echo "$title" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g')
                clean_link=$(echo "$link" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g')
                
                if [ "$clean_title" != "PodEduC" ] && [ "$clean_title" != "PodEduC - CREIA" ]; then
                  # Extraction de l'ID de la vidéo pour reconstituer l'image de la vignette
                  video_id=$(echo "$clean_link" | grep -oP '(?<=/video/)[0-8a-zA-Z_-]+')
                  thumb_url="https://podeduc.apps.education.fr/media/thumbnails/${video_id}.png"

                  cat << EOF >> index.html
                  <a class="video-card" href="${clean_link}" target="_blank">
                    <div class="thumbnail-wrapper">
                      <img src="${thumb_url}" onerror="this.src='https://podeduc.apps.education.fr/static/core/img/logo-pod.png'" alt="Vignette">
                    </div>
                    <div class="video-info">
                      <p class="video-title">${clean_title}</p>
                    </div>
                  </a>
          EOF
                fi
              fi
            fi
          done

          rm -f item_* flux.xml

          cat << 'EOF' >> index.html
            </div>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Grille de vignettes cliquables natives sans iframe cassee" && git push)
