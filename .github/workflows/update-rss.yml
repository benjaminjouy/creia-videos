name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch RSS Feed and Build Table HTML
        run: |
          cat << 'EOF' > parse_feed.py
          import urllib.request
          import xml.etree.ElementTree as ET

          url = "https://podeduc.apps.education.fr/rss-video/creia/"
          
          html_header = """
          <table style="width: 100%; max-width: 1000px; margin: 0 auto; border-collapse: separate; border-spacing: 20px; font-family: sans-serif; table-layout: fixed;">
            <tbody>
          """

          try:
              response = urllib.request.urlopen(url)
              root = ET.fromstring(response.read())
              
              videos = []
              for item in root.findall('.//item'):
                  title = item.find('title')
                  link = item.find('link')
                  if title is not None and link is not None:
                      t_text = title.text.replace("<![CDATA[", "").replace("]]>", "").strip()
                      l_text = link.text.replace("<![CDATA[", "").replace("]]>", "").strip()
                      if t_text not in ["PodEduC", "PodEduC - CREIA", "PodEduC  CREIA"] and "/video/" in l_text:
                          videos.append((t_text, l_text))
              
              # On limite strictement aux 8 premières vidéos du flux
              videos = videos[:8]
              
              rows_html = ""
              for i in range(0, len(videos), 2):
                  rows_html += "    <tr>\n"
                  # Colonne Gauche
                  title, url = videos[i]
                  rows_html += f"""      <td style="width: 50%; vertical-align: top; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; text-align: center;">
                    <p style="font-weight: bold; font-size: 14px; margin-bottom: 12px; color: #333; min-height: 40px;">{title}</p>
                    <div style="margin: 10px auto;"><a href="{url}">{url}</a></div>
                  </td>\n"""
                  
                  # Colonne Droite (si elle existe)
                  if i + 1 < len(videos):
                      title2, url2 = videos[i+1]
                      rows_html += f"""      <td style="width: 50%; vertical-align: top; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; text-align: center;">
                    <p style="font-weight: bold; font-size: 14px; margin-bottom: 12px; color: #333; min-height: 40px;">{title2}</p>
                    <div style="margin: 10px auto;"><a href="{url2}">{url2}</a></div>
                  </td>\n"""
                  else:
                      rows_html += '      <td style="width: 50%;"></td>\n'
                  rows_html += "    </tr>\n"
                  
              full_html = html_header + rows_html + "  </tbody>\n</table>"
              
              with open("index.html", "w", encoding="utf-8") as f:
                  f.write(full_html)
                  
          except Exception as e:
              print(f"Erreur: {e}")
          EOF
          python3 parse_feed.py
          rm parse_feed.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise a jour auto du tableau des videos" && git push)
