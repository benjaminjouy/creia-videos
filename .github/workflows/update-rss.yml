name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch RSS Feed and Build HTML
        run: |
          curl -sL "https://podeduc.apps.education.fr/rss-video/creia/" > flux.xml
          
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Flux Vidéos CREIA</title>
            <style>
              body { font-family: sans-serif; background-color: #ffffff; color: #333; padding: 15px; margin: 0; }
              .video-container { max-width: 800px; margin: 0 auto; }
              .video-item { margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
              .video-title { font-weight: bold; font-size: 16px; text-align: center; margin-bottom: 15px; color: #333; }
            </style>
          </head>
          <body>
            <div class="video-container">
          EOF

          # Extraction par bloc <item> pour lier correctement le titre et son lien d'origine
          csplit -s -k -f item_ flux.xml '/<item>/' '{*}' 2>/dev/null || true

          for f in item_*; do
            if [ -f "$f" ]; then
              title=$(grep -oP '(?<=<title>).*?(?=</title>)' "$f" | head -n 1)
              # On récupère ici le lien de la page de la vidéo (<link>), pas le fichier brut
              link=$(grep -oP '(?<=<link>).*?(?=</link>)' "$f" | head -n 1)

              if [ ! -z "$title" ] && [ ! -z "$link" ]; then
                clean_title=$(echo "$title" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g')
                clean_link=$(echo "$link" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g')
                
                if [ "$clean_title" != "PodEduC" ] && [ "$clean_title" != "PodEduC - CREIA" ]; then
                  cat << EOF >> index.html
                  <div class="video-item">
                    <p class="video-title">${clean_title}</p>
                    <a href="${clean_link}" target="_blank" rel="noopener">${clean_link}</a>
                  </div>
          EOF
                fi
              fi
            fi
          done

          rm -f item_* flux.xml

          cat << 'EOF' >> index.html
            </div>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Utilisation des filtres natifs Magistere" && git push)
