name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch RSS Feed and Build JSON
        run: |
          curl -sL "https://podeduc.apps.education.fr/rss-video/creia/" > flux.xml
          
          # Initialisation du fichier JSON
          echo "[" > videos.json
          first=true

          csplit -s -k -f item_ flux.xml '/<item>/' '{*}' 2>/dev/null || true

          for f in item_*; do
            if [ -f "$f" ]; then
              title=$(grep -oP '(?<=<title>).*?(?=</title>)' "$f" | head -n 1)
              link=$(grep -oP '(?<=<link>).*?(?=</link>)' "$f" | head -n 1)

              if [ ! -z "$title" ] && [ ! -z "$link" ]; then
                clean_title=$(echo "$title" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g' | sed 's/"/\\"/g')
                clean_link=$(echo "$link" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g')
                
                if [ "$clean_title" != "PodEduC" ] && [ "$clean_title" != "PodEduC - CREIA" ]; then
                  if [ "$first" = true ]; then
                    first=false
                  else
                    echo "," >> videos.json
                  fi
                  
                  # Ajout de l'objet vidéo dans le tableau JSON
                  echo "  {\"title\": \"$clean_title\", \"url\": \"$clean_link\"}" >> videos.json
                fi
              fi
            fi
          done

          echo "" >> videos.json
          echo "]" >> videos.json
          
          rm -f item_* flux.xml

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour du flux JSON des vidéos" && git push)
