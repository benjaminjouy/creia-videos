name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Fetch RSS Feed, Categorize Multi-criteria and Build Grid (Node.js)
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const https = require('https');

          const rssUrl = "https://podeduc.apps.education.fr/rss-video/creia/";

          https.get(rssUrl, (res) => {
            let data = '';
            res.on('data', (chunk) => { data += chunk; });
            res.on('end', () => {
              const items = data.split('<item>');
              items.shift(); 

              const videoList = [];

              items.forEach(item => {
                const titleMatch = item.match(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/);
                const linkMatch = item.match(/<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/);
                const dateMatch = item.match(/<(?:pubDate|dc:date|updated|date)[^>]*>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/(?:pubDate|dc:date|updated|date)>/i);

                if (titleMatch && linkMatch) {
                  const title = titleMatch[1].trim();
                  const link = linkMatch[1].trim();
                  
                  let pubDate = new Date(0);
                  if (dateMatch && dateMatch[1]) {
                    const parsedDate = new Date(dateMatch[1].trim());
                    if (!isNaN(parsedDate.getTime())) {
                      pubDate = parsedDate;
                    }
                  }

                  // Attribution multi-catégories sous forme de tableau
                  const categories = [];
                  const lowerTitle = title.toLowerCase();
                  
                  if (lowerTitle.match(/webinaire|conference|direct/)) {
                    categories.push('webinaire');
                  }
                  if (lowerTitle.match(/mois/)) {
                    categories.push('mois-ia');
                  }
                  if (lowerTitle.match(/innov|projet|experimentation/)) {
                    categories.push('innov');
                  }
                  
                  // Si aucun mot-clé ne match, la vidéo va dans "Autres"
                  if (categories.length === 0) {
                    categories.push('autres');
                  }

                  if (title !== "PodEduC" && title !== "PodEduC - CREIA") {
                    videoList.push({ title, link, pubDate, categories });
                  }
                }
              });

              videoList.sort((a, b) => b.pubDate - a.pubDate);

              let videoCardsHtml = '';

              videoList.forEach(video => {
                let formattedDate = "";
                if (video.pubDate.getTime() !== 0) {
                  const day = String(video.pubDate.getDate()).padStart(2, '0');
                  const month = String(video.pubDate.getMonth() + 1).padStart(2, '0');
                  const year = video.pubDate.getFullYear();
                  formattedDate = `${day}/${month}/${year}`;
                }

                // Jointure des catégories dans l'attribut data-category séparées par des espaces
                const catString = video.categories.join(' ');

                videoCardsHtml += `
            <a class="video-card" href="${video.link}" target="_blank" rel="opener" data-category="${catString}">
              <div class="thumbnail-wrapper" style="background-image: url('https://partage02.magistere.apps.education.fr/pluginfile.php/512678/mod_page/content/12/66e4c716-930d-42aa-964c-e58db2653422.jpg');">
                <svg class="pod-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="50" cy="50" r="40" fill="none" stroke="#ff0000" stroke-width="6" opacity="0.4"/>
                  <polygon points="40,30 70,50 40,70" fill="#ff0000" />
                </svg>
              </div>
              <div class="video-info">
                <div>
                  <p class="video-title">${video.title} ${formattedDate ? `<span class="title-date">(${formattedDate})</span>` : ''}</p>
                </div>
              </div>
            </a>`;
              });

              const htmlHeader = '<!DOCTYPE html>\n' +
          '<html lang="fr">\n' +
          '<head>\n' +
          '  <meta charset="UTF-8">\n' +
          '  <title>Chaîne CREIA</title>\n' +
          '  <base target="_blank">\n' +
          '  <style>\n' +
          '    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #ffffff; color: #333; padding: 10px; margin: 0; }\n' +
          '    .filter-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }\n' +
          '    .filter-btn { background: #f4f7f6; color: #2c3e50; border: 2px solid #e2e5ec; padding: 8px 18px; font-weight: bold; font-size: 13px; border-radius: 20px; cursor: pointer; transition: 0.2s; }\n' +
          '    .filter-btn:hover, .filter-btn.active { background: #0b1a3d; color: #fff; border-color: #4169E1; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }\n' +
          '    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 100%; margin: 0 auto; }\n' +
          '    .video-card { background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.2s; display: flex; flex-direction: column; border: 1px solid #eef2f5; }\n' +
          '    .video-card:hover { transform: translateY(-4px); box-shadow: 0 6px 15px rgba(0,123,255,0.15); }\n' +
          '    .thumbnail-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background-color: #1a1a1a; background-size: cover; background-position: center; background-repeat: no-repeat; overflow: hidden; display: flex; align-items: center; justify-content: center; }\n' +
          '    .pod-logo-svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; transition: transform 0.2s; }\n' +
          '    .video-card:hover .pod-logo-svg { transform: translate(-50%, -50%) scale(1.1); }\n' +
          '    .video-info { padding: 15px; flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #f8f9fa; min-height: 80px; text-align: center; }\n' +
          '    .video-title { font-weight: bold; font-size: 14px; margin: 0; color: #2c3e50; line-height: 1.4; }\n' +
          '    .title-date { font-size: 12px; color: #7f8c8d; font-weight: normal; margin-left: 5px; display: inline-block; }\n' +
          '  </style>\n' +
          '</head>\n' +
          '<body>\n' +
          '  <div class="filter-container">\n' +
          '    <button class="filter-btn active" onclick="filterVideos(\'tous\')">✨ Tout Voir</button>\n' +
          '    <button class="filter-btn" onclick="filterVideos(\'webinaire\')">🎙️ Webinaire</button>\n' +
          '    <button class="filter-btn" onclick="filterVideos(\'mois-ia\')">📅 Mois de l\'IA</button>\n' +
          '    <button class="filter-btn" onclick="filterVideos(\'innov\')">🚀 Actions Innovantes</button>\n' +
          '    <button class="filter-btn" onclick="filterVideos(\'autres\')">📂 Autres</button>\n' +
          '  </div>\n' +
          '  <div class="video-grid">\n';

              const htmlFooter = '\n  </div>\n' +
          '  <script>\n' +
          '    function filterVideos(cat) {\n' +
          '      const cards = document.querySelectorAll(".video-card");\n' +
          '      const btns = document.querySelectorAll(".filter-btn");\n' +
          '      btns.forEach(b => b.classList.remove("active"));\n' +
          '      event.currentTarget.classList.add("active");\n' +
          '      cards.forEach(card => {\n' +
          '        const cardCats = card.getAttribute("data-category").split(" ");\n' +
          '        if(cat === "tous" || cardCats.includes(cat)) {\n' +
          '          card.style.display = "flex";\n' +
          '        } else {\n' +
          '          card.style.display = "none";\n' +
          '        }\n' +
          '      });\n' +
          '    }\n' +
          '  </script>\n' +
          '</body>\n' +
          '</html>';
          
              const finalHtml = htmlHeader + videoCardsHtml + htmlFooter;

              fs.writeFileSync('index.html', finalHtml);
              console.log("index.html mis à jour avec le système multi-catégories filtrable.");
            });
          }).on('error', (e) => {
            console.error(e);
            process.exit(1);
          });
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour des boutons et du filtrage multi-critères" && git push)
