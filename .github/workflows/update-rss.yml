name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Build HTML PodEduC Channel Page
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Chaîne CREIA PodEduC</title>
            <style>
              html, body { 
                margin: 0; 
                padding: 0; 
                width: 100%; 
                height: 2500px; /* Grande hauteur pour voir défiler toutes les vidéos */
                overflow: hidden; 
                background-color: #ffffff; 
              }
              
              .wrapper {
                width: 100%;
                height: 100%;
                overflow: hidden;
                position: relative;
              }
              
              /* Propulsion de l'iframe vers le haut (-1050px) pour atteindre directement les vidéos */
              iframe { 
                position: absolute;
                top: -1050px; 
                left: 0;
                width: 100%; 
                height: calc(100% + 1050px);
                border: none; 
                
                /* Force la boîte de dialogue des cookies à se centrer en dehors de la zone visible */
                transform: scale(1.02);
                transform-origin: top center;
              }
            </style>
          </head>
          <body>
            <div class="wrapper">
              <iframe src="https://podeduc.apps.education.fr/creia/" allowfullscreen transparency allow="autoplay; fullscreen"></iframe>
            </div>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Descente majeure au niveau des videos et masquage complet modale" && git push)
