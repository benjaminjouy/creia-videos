name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Build HTML PodEduC Channel Page
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Chaîne CREIA PodEduC</title>
            <style>
              html, body { margin: 0; padding: 0; width: 100%; height: 2200px; background-color: #ffffff; }
              /* Conteneur pour créer une fenêtre de défilement artificielle */
              .scroll-container { width: 100%; height: 100%; overflow: hidden; }
              iframe { width: 100%; height: 100%; border: none; }
            </style>
          </head>
          <body>
            <div class="scroll-container">
              <iframe id="pod-iframe" src="https://podeduc.apps.education.fr/creia/" allowfullscreen transparency allow="autoplay; fullscreen"></iframe>
            </div>

            <script>
              // Attendre 1,2 seconde que PodEduC charge ses éléments, puis descendre automatiquement
              window.addEventListener('load', function() {
                setTimeout(function() {
                  window.scrollTo({
                    top: 180,
                    behavior: 'smooth'
                  });
                }, 1200);
              });
            </script>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Ajout du scroll automatique temporise" && git push)
