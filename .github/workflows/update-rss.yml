name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *' # Tous les jours à 6h du matin
  workflow_dispatch: # Bouton manuel

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      - name: Fetch RSS Feed and Build HTML
        run: |
          # Téléchargement du flux PodÉduc
          id_flux=$(curl -sL "https://podeduc.apps.education.fr/rss-video/creia/")
          
          # Création d'un index.html tout neuf et propre
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Flux Vidéos CREIA</title>
            <style>
              body {
                font-family: 'Segoe UI', Arial, sans-serif;
                background-color: #ffffff;
                color: #333;
                padding: 15px;
                margin: 0;
              }
              .video-container {
                max-width: 100%;
                margin: 0 auto;
              }
              .video-item {
                margin-bottom: 25px;
                border-bottom: 1px solid #e2e5ec;
                padding-bottom: 20px;
                text-align: center;
              }
              .video-item:last-child {
                border-bottom: none;
                margin-bottom: 0;
                padding-bottom: 0;
              }
              .video-title {
                font-weight: bold;
                font-size: 20px;
                color: #2c3e50;
                margin: 0 0 12px 0;
                line-height: 1.4;
              }
              .video-link {
                color: #2980b9;
                text-decoration: underline;
                font-size: 1.1em;
                font-weight: 500;
                display: inline-block;
              }
              .video-link:hover {
                color: #3498db;
              }
            </style>
          </head>
          <body>
            <div class="video-container">
          EOF

          # Extraction robuste des titres et des liens
          titles=$(echo "$id_flux" | grep -oP '(?<=<title>).*?(?=</title>)' | tail -n +2)
          links=$(echo "$id_flux" | grep -oP '(?<=<link>).*?(?=</link>)' | tail -n +2)

          # Assemblage du HTML élément par élément
          paste <(echo "$titles") <(echo "$links") | while IFS=$'\t' read -r title link; do
            if [ ! -z "$title" ] && [ ! -z "$link" ]; then
              # Nettoyage des éventuels caractères CDATA
              clean_title=$(echo "$title" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g')
              clean_link=$(echo "$link" | sed 's/<!\[CDATA\[//g' | sed 's/\]\]>//g')
              
              cat << EOF >> index.html
              <div class="video-item">
                <p class="video-title">${clean_title}</p>
                <a class="video-link" href="${clean_link}" target="_blank" rel="noopener">Regarder la vidéo</a>
              </div>
          EOF
            fi
          done

          cat << 'EOF' >> index.html
            </div>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Nettoyage et mise à jour statique CREIA" && git push)
