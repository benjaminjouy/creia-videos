name: Update CREIA RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .

      - name: Build HTML PodEduC Channel Page
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Chaîne CREIA PodEduC</title>
            <style>
              html, body { 
                margin: 0; 
                padding: 0; 
                width: 100%; 
                height: 2000px; 
                overflow: hidden; 
                background-color: #ffffff; 
              }
              
              .wrapper {
                width: 100%;
                height: 100%;
                overflow: hidden;
                position: relative;
              }
              
              /* Décalage pour masquer le texte supérieur */
              iframe { 
                position: absolute;
                top: -240px; 
                left: 0;
                width: 100%; 
                height: calc(100% + 240px); 
                border: none; 
              }
            </style>
          </head>
          <body>
            <div class="wrapper">
              <iframe id="pod-iframe" src="https://podeduc.apps.education.fr/creia/" allowfullscreen transparency allow="autoplay; fullscreen"></iframe>
            </div>

            <script>
              // Script pour injecter du CSS et masquer la bâche et la popup des cookies
              const iframe = document.getElementById('pod-iframe');
              
              iframe.addEventListener('load', () => {
                try {
                  const iframeDocument = iframe.contentDocument || iframe.contentWindow.document;
                  const style = iframeDocument.createElement('style');
                  
                  // Masque la modale de cookies (.modal) et le fond sombre (.modal-backdrop)
                  style.textContent = `
                    .modal, .modal-backdrop, #cookie-law-info-bar { 
                      display: none !important; 
                      visibility: hidden !important; 
                      opacity: 0 !important; 
                    }
                    body { overflow: auto !important; }
                  `;
                  iframeDocument.head.appendChild(style);
                } catch (e) {
                  console.log("Note : Blocage de sécurité de l'Éducation Nationale sur l'injection directe (Cross-Origin).");
                }
              });
            </script>
          </body>
          </html>
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Masquage de la modale cookie et ajustement du bandeau" && git push)
