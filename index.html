<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chaîne CREIA PodEduC</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 3000px; /* Augmenté pour défiler encore plus bas */
      overflow: hidden; 
      background-color: #ffffff; 
    }
    
    .wrapper {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    
    /* Descente extrême (-1450px) pour sauter tout le texte résiduel */
    iframe { 
      position: absolute;
      top: -1450px; 
      left: -2%;
      width: 104%; 
      height: calc(100% + 1450px);
      border: none; 
      
      /* Super-astuce : On réduit l'échelle globale de l'iframe pour forcer la popup 
         de cookies et son voile noir à rétrécir et à s'isoler tout en haut de la page,
         rendant la zone du bas totalement transparente et cliquable */
      transform: scale(1);
      transform-origin: top center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe src="https://podeduc.apps.education.fr/creia/" allowfullscreen transparency allow="autoplay; fullscreen"></iframe>
  </div>
</body>
</html>
