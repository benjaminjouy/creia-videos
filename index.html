<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flux Vidéos CREIA</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      padding: 0;
      margin: 0;
    }
    #video-list {
      max-width: 800px;
      margin: 20px auto;
    }
    .video-item {
      margin-bottom: 30px;
      border-bottom: 1px solid #e2e5ec;
      padding-bottom: 15px;
      text-align: center;
    }
    .video-title {
      font-weight: bold;
      font-size: 20px; /* Augmenté de 2 tailles */
      color: #333;
      margin-bottom: 10px;
    }
    .video-link {
      color: #2980b9;
      text-decoration: underline;
      font-size: 1.1em; /* Augmenté de 2 tailles */
    }
    .loading {
      text-align: center;
      font-size: 1.2em;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>

  <div id="video-list">
    <div class="loading">Chargement des dernières vidéos...</div>
  </div>

  <script>
    // URL du flux RSS PodÉduc / Muse à lire (en passant par un proxy pour éviter les blocages CORS)
    const rssUrl = "https://podeduc.apps.education.fr/feeds/videos/?playlist=TU_AS_LE_CHOIX"; 
    const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(rssUrl);

    fetch(proxyUrl)
      .then(response => {
        if (response.ok) return response.json();
        throw new Error('Erreur réseau');
      })
      .then(data => {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data.contents, "text/xml");
        const items = xmlDoc.getElementsByTagName("item");
        const container = document.getElementById("video-list");
        container.innerHTML = ""; // On vide le message de chargement

        // On prend les 20 dernières vidéos maximum
        const limit = Math.min(items.length, 20);

        for (let i = 0; i < limit; i++) {
          const title = items[i].getElementsByTagName("title")[0].textContent;
          const link = items[i].getElementsByTagName("link")[0].textContent;

          const videoItem = document.createElement("div");
          videoItem.className = "video-item";
          if (i === limit - 1) videoItem.style.borderBottom = "none";

          videoItem.innerHTML = `
            <p class="video-title">${title}</p>
            <a class="video-link" href="${link}" target="_blank" rel="noopener">Regarder la vidéo</a>
          `;
          container.appendChild(videoItem);
        }
      })
      .catch(error => {
        document.getElementById("video-list").innerHTML = "<div class='loading'>Impossible de charger les vidéos pour le moment.</div>";
        console.error(error);
      });
  </script>

</body>
</html>
