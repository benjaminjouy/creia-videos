/* -------------------------------------------------------

const grid = document.getElementById("videoGrid");

videos.forEach((video, index) => {

  const card = document.createElement("a");

  card.className = "video-card";
  card.href = video.url;
  card.target = "_blank";
  card.rel = "noopener";

  card.innerHTML = `

    <div class="thumbnail-wrapper" id="thumb-${index}">

      <div class="thumbnail-fallback"></div>

      <svg class="pod-logo-svg"
           viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg">

          cx="50"
          cy="50"
          r="40"
          fill="none"
          stroke="#ff0000"
          stroke-width="6"
          opacity="0.4"/>

        <polygon
          points="40,30 70,50 40,70"
          fill="#ff0000"/>

      </svg>

    </div>

    <div class="video-info">
      <div>
        <p class="video-title">
          ${video.titre}
          <span class="title-date">
            (${video.date})
          </span>
        </p>
      </div>
    </div>

  `;

  grid.appendChild(card);

});


/* -------------------------------------------------------
   RÉCUPÉRATION AUTOMATIQUE DE LA MINIATURE PODEDUC
------------------------------------------------------- */

async function chargerMiniature(video, index) {

  try {

    const response = await fetch(video.url);

    if (!response.ok) {
      throw new Error("Page PodÉduc inaccessible");
    }

    const html = await response.text();

    const parser = new DOMParser();
    const documentPod = parser.parseFromString(html, "text/html");

    /* On cherche d'abord l'image OpenGraph */
    let miniature =
      documentPod.querySelector('meta[property="og:image"]')?.content;

    /* Puis Twitter Image si nécessaire */
    if (!miniature) {
      miniature =
        documentPod.querySelector('meta[name="twitter:image"]')?.content;
    }

    /* Conversion éventuelle d'une URL relative */
    if (miniature) {

      miniature = new URL(miniature, video.url).href;

      const wrapper =
        document.getElementById(`thumb-${index}`);

      const img = document.createElement("img");

      img.className = "thumbnail";
      img.src = miniature;
      img.alt = video.titre;
      img.loading = "lazy";

      /* Si l'image elle-même échoue,
         le fond générique reste visible. */
      img.onerror = function () {
        this.remove();
      };

      wrapper.prepend(img);

    }

  } catch (erreur) {

    /*
      IMPORTANT :
      Si PodÉduc interdit la lecture de ses pages
      depuis GitHub Pages (CORS), on ne casse rien.

      L'ancienne image générique reste affichée.
    */

    console.log(
      "Miniature PodÉduc non récupérable :",
      video.url
    );

  }

}


/* -------------------------------------------------------
   LANCEMENT
------------------------------------------------------- */

videos.forEach((video, index) => {
  chargerMiniature(video, index);
