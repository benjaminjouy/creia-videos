<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flux Vidéos CREIA</title>
  <style>
    /* Style général de la page GitHub */
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
      padding: 10px;
      margin: 0;
    }
    
    /* Ciblage et reformatage complet du flux généré */
    .gsh-feed-container, #video-list, ul, li, div {
      max-width: 100%;
      margin: 0 auto;
      list-style: none;
      padding: 0;
    }

    /* Formatage de chaque bloc vidéo */
    .feed-item, li, .gsh-item {
      margin-bottom: 30px !important;
      border-bottom: 1px solid #e2e5ec !important;
      padding-bottom: 15px !important;
      text-align: center !important;
      display: block !important;
    }
    
    /* Force la suppression de la bordure sur le dernier élément */
    .feed-item:last-child, li:last-child {
      border-bottom: none !important;
      margin-bottom: 0 !important;
      padding-bottom: 0 !important;
    }

    /* Grossissement des titres à 20px (Augmenté de 2 tailles) */
    .feed-title, a, h3, .gsh-title {
      font-weight: bold !important;
      font-size: 20px !important; 
      color: #333 !important;
      margin-bottom: 10px !important;
      text-decoration: none !important;
      display: block !important;
    }

    /* Création et grossissement du bouton "Regarder la vidéo" à 1.1em */
    .feed-link-action, a::after, .gsh-link {
      color: #2980b9 !important;
      text-decoration: underline !important;
      font-size: 1.1em !important;
      font-weight: normal !important;
      display: block !important;
      margin-top: 5px !important;
    }
  </style>
</head>
<body>

  <div id="video-list">
    <!-- Inclusion HTML directe du flux RSS CREIA via le parseur alternatif -->
    <script type="text/javascript" src="https://feed.informer.com/widgets/8L6N8WQX2N.js"></script>
  </div>

</body>
</html>
