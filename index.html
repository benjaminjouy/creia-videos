<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flux Vidéos CREIA</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #ffffff; /* Fond blanc pour s'intégrer proprement dans l'iframe Magistère */
      color: #333;
      padding: 10px;
      margin: 0;
    }
    #video-list {
      max-width: 100%;
      margin: 0 auto;
    }
    .video-item {
      margin-bottom: 30px;
      border-bottom: 1px solid #e2e5ec;
      padding-bottom: 15px;
      text-align: center;
    }
    .video-title {
      font-weight: bold;
      font-size: 20px; /* Taille augmentée */
      color: #333;
      margin-bottom: 10px;
    }
    .video-link {
      color: #2980b9;
      text-decoration: underline;
      font-size: 1.1em; /* Taille augmentée */
    }
    .loading {
      text-align: center;
      font-size: 1.2em;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>

  <div id="video-list">
    <div class="loading">Chargement des dernières vidéos...</div>
  </div>

  <script>
    // METS TON LIEN RSS PODEDUC ENTRE LES GUILLEMETS CI-DESSOUS
    const rssUrl = "https://podeduc.apps.education.fr/feeds/videos/?playlist=METS_ICI_L_ID_DE_TA_PLAYLIST"; 
    
    // Utilisation d'un proxy CORS public et ultra-rapide
    const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(rssUrl);

    fetch(proxyUrl)
      .then(response => {
        if (response.ok) return response.json();
        throw new Error('Erreur de réseau');
      })
      .then(data => {
        const parser = new DOMParser();
        // PodÉduc utilise généralement le format Atom (xml) ou RSS standard
        const xmlDoc = parser.parseFromString(data.contents, "text/xml");
        
        // Gestion hybride RSS (<item>) et Atom (<entry>) pour être sûr de capter les vidéos
        let items = xmlDoc.getElementsByTagName("item");
        let isAtom = false;
        
        if (items.length === 0) {
          items = xmlDoc.getElementsByTagName("entry");
          isAtom = true;
        }

        const container = document.getElementById("video-list");
        container.innerHTML = ""; 

        if (items.length === 0) {
          container.innerHTML = "<div class='loading'>Aucune vidéo trouvée dans ce flux.</div>";
          return;
        }

        const limit = Math.min(items.length, 20);

        for (let i = 0; i < limit; i++) {
          let title = "";
          let link = "";

          if (isAtom) {
            title = items[i].getElementsByTagName("title")[0].textContent;
            // Dans Atom, le lien est souvent dans un attribut href
            const linkNode = items[i].getElementsByTagName("link")[0];
            link = linkNode.getAttribute("href") || linkNode.textContent;
          } else {
            title = items[i].getElementsByTagName("title")[0].textContent;
            link = items[i].getElementsByTagName("link")[0].textContent;
          }

          const videoItem = document.createElement("div");
          videoItem.className = "video-item";
          if (i === limit - 1) videoItem.style.borderBottom = "none";

          videoItem.innerHTML = `
            <p class="video-title">${title}</p>
            <a class="video-link" href="${link}" target="_blank" rel="noopener">Regarder la vidéo</a>
          `;
          container.appendChild(videoItem);
        }
      })
      .catch(error => {
        document.getElementById("video-list").innerHTML = "<div class='loading'>Impossible de charger les vidéos pour le moment.</div>";
        console.error(error);
      });
  </script>

</body>
</html>
