<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chaîne CREIA PodEduC</title>
  <style>
    /* On force l'affichage de la barre de défilement sur Magistère */
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: auto; 
      min-height: 100%;
      overflow-y: auto !important; 
      background-color: #ffffff; 
    }
    
    /* Le conteneur définit la hauteur totale visible pour scroller */
    .scroll-box {
      width: 100%;
      height: 2800px; /* Grande hauteur pour faire défiler toutes les vidéos */
      position: relative;
      overflow: hidden;
    }
    
    /* Le masque magique : on coupe les 850 premiers pixels du haut.
       Le voile noir et la popup des cookies n'existent plus dans cette zone ! */
    .clipper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      clip-path: inset(850px 0px 0px 0px);
      transform: translateY(-850px);
    }
    
    iframe { 
      width: 100%; 
      height: 100%;
      border: none; 
    }
  </style>
</head>
<body>
  <div class="scroll-box">
    <div class="clipper">
      <iframe src="https://podeduc.apps.education.fr/creia/" allowfullscreen transparency allow="autoplay; fullscreen"></iframe>
    </div>
  </div>
</body>
</html>
