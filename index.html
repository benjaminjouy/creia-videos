<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chaîne CREIA PodEduC</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 1800px; /* Ajuste ici pour allonger la hauteur globale de ton catalogue */
      overflow: hidden; 
      background-color: #ffffff; 
    }
    
    .wrapper {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    
    /* Décalage augmenté à -480px pour sauter TOUT le texte d'introduction */
    iframe { 
      position: absolute;
      top: -480px; 
      left: 0;
      width: 100%; 
      height: 100%; /* Bloque la hauteur pour envoyer la popup des cookies dans le vide */
      border: none; 
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe src="https://podeduc.apps.education.fr/creia/" allowfullscreen transparency allow="autoplay; fullscreen"></iframe>
  </div>
</body>
</html>
