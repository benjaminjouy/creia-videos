<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flux Vidéos CREIA</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
      padding: 10px;
      margin: 0;
    }
    #wrapper {
      max-width: 100%;
      margin: 0 auto;
    }
    /* Style pour forcer l'affichage personnalisé du flux */
    .rss-feed {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .rss-item {
      margin-bottom: 30px !important;
      border-bottom: 1px solid #e2e5ec !important;
      padding-bottom: 15px !important;
      text-align: center !important;
    }
    .rss-item:last-child {
      border-bottom: none !important;
    }
    /* Titre de la vidéo agrandi à 20px */
    .rss-item a.rss-title {
      font-weight: bold !important;
      font-size: 20px !important;
      color: #333 !important;
      text-decoration: none !important;
      display: block !important;
      margin-bottom: 10px !important;
    }
    /* Lien d'action sous le titre agrandi à 1.1em */
    .rss-item .rss-action-link {
      color: #2980b9 !important;
      text-decoration: underline !important;
      font-size: 1.1em !important;
      display: inline-block !important;
    }
  </style>
</head>
<body>

  <div id="wrapper">
    <!-- Générateur de flux direct sans script complexe -->
    <iframe src="https://feed.mikle.com/widget/v2/162435/" height="800px" width="100%" class="fw-iframe" scrolling="no" frameborder="0"></iframe>
  </div>

</body>
</html>
