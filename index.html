<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chaîne CREIA PodEduC</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      /* Réactivation essentielle de la barre de défilement globale */
      overflow-y: auto !important; 
      background-color: #ffffff; 
    }
    
    /* Le wrapper gère maintenant le décalage pour masquer le texte et casser le voile noir */
    .wrapper {
      width: 100%;
      height: 2500px; /* Ajuste cette hauteur pour voir plus ou moins de vidéos */
      margin-top: -1250px; /* Remonté légèrement (un peu plus haut que -1450px) */
      position: relative;
      background-color: #ffffff;
    }
    
    /* L'iframe reste stable et ne propage plus son voile noir sur toute la page */
    iframe { 
      width: 100%; 
      height: 100%;
      border: none; 
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe src="https://podeduc.apps.education.fr/creia/" allowfullscreen transparency allow="autoplay; fullscreen"></iframe>
  </div>
</body>
</html>
