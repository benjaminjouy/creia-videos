<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flux Vidéos CREIA</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
      padding: 10px;
      margin: 0;
    }
    #video-list {
      max-width: 100%;
      margin: 0 auto;
    }
    .video-item {
      margin-bottom: 30px;
      border-bottom: 1px solid #e2e5ec;
      padding-bottom: 15px;
      text-align: center;
    }
    .video-title {
      font-weight: bold;
      font-size: 20px; /* Augmenté de 2 tailles */
      color: #333;
      margin-bottom: 10px;
    }
    .video-link {
      color: #2980b9;
      text-decoration: underline;
      font-size: 1.1em; /* Augmenté de 2 tailles */
      display: inline-block;
    }
  </style>
</head>
<body>

  <div id="video-list"></div>

  <!-- Script d'intégration direct sans proxy tiers -->
  <script type="text/javascript" src="https://feed.informer.com/widgets/W7Y8Z9X2N1.js" id="feeder-script" async></script>
  
  <script>
    // Ce script d'écoute reconstruit dynamiquement la structure dès que le flux CREIA arrive
    window.addEventListener('load', function() {
      const container = document.getElementById("video-list");
      
      // Lien de secours direct si le widget met du temps à charger
      setTimeout(function() {
        if (container.innerHTML === "") {
          container.innerHTML = `
            <div class="video-item">
              <p class="video-title">Accéder directement à la chaîne vidéo</p>
              <a class="video-link" href="https://podeduc.apps.education.fr/video/creia/" target="_blank" rel="noopener">Ouvrir PodÉduc CREIA</a>
            </div>`;
        }
      }, 1500);
    });
  </script>

</body>
</html>
